<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e17"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#382f25"/>
      <stop offset="100%" stop-color="#1c1611"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Cassette Body -->
  <g filter="url(#glow)">
    <rect x="10" y="15" width="44" height="34" rx="5" fill="url(#tapeGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>

    <!-- Top label line -->
    <path d="M14 19 H50" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Center tape window -->
    <rect x="16" y="24" width="32" height="15" rx="3" fill="#0d0b09" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Left Reel Spool -->
    <circle cx="24" cy="31.5" r="5" fill="#1f1b16" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <circle cx="24" cy="31.5" r="2" fill="#f59e0b"/>
    <!-- Spool teeth -->
    <line x1="24" y1="27.5" x2="24" y2="29" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="24" y1="34" x2="24" y2="35.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="20" y1="31.5" x2="21.5" y2="31.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="26.5" y1="31.5" x2="28" y2="31.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Right Reel Spool -->
    <circle cx="40" cy="31.5" r="5" fill="#1f1b16" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <circle cx="40" cy="31.5" r="2" fill="#f59e0b"/>
    <!-- Spool teeth -->
    <line x1="40" y1="27.5" x2="40" y2="29" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="40" y1="34" x2="40" y2="35.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="36" y1="31.5" x2="37.5" y2="31.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="42.5" y1="31.5" x2="44" y2="31.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Connecting Tape Bridge -->
    <line x1="29" y1="31.5" x2="35" y2="31.5" stroke="#f59e0b" stroke-width="1" stroke-dasharray="1.5 1"/>

    <!-- Bottom trapezoid tape guide -->
    <path d="M19 44 L22 47 H42 L45 44 Z" fill="#241e17" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="24" cy="45.5" r="0.8" fill="#f59e0b"/>
    <circle cx="40" cy="45.5" r="0.8" fill="#f59e0b"/>
  </g>

  <!-- Audio Wave Radiance over top -->
  <path d="M28 9 C30 7.5, 34 7.5, 36 9" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M25 6 C29 4, 35 4, 39 6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
